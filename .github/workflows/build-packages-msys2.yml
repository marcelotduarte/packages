name: Build packages msys2

on:
  workflow_call:
    inputs:
      branch:
        default: develop
        required: true
        type: string
      tests:
        default: false
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      branch:
        default: develop
        required: true
        type: choice
        options:
          - develop
          - main
      tests:
        default: true
        required: false
        type: boolean

jobs:

  build_sdist:
    name: Build sdist cx-freeze
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      UV_SYSTEM_PYTHON: true
    steps:

      - name: '🧰 Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.branch }}
          repository: marcelotduarte/cx_Freeze

      - name: '⚙️ Set up Python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: '⚙️ Set up uv'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: "pyproject.toml"
          enable-cache: true

      - name: '🚧 Build source distribution'
        run: uv build --sdist -o wheelhouse

      - name: '📤 Upload artifact: sdist'
        uses: actions/upload-artifact@v7
        with:
          name: cx-freeze-sdist
          path: wheelhouse
          compression-level: 0  # no compression

  build_sdist_freeze_core:
    name: Build sdist freeze-core
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      UV_SYSTEM_PYTHON: true
    steps:

      - name: '🧰 Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          #ref: ${{ inputs.branch }}
          repository: marcelotduarte/freeze-core

      - name: '⚙️ Set up Python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: '⚙️ Set up uv'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: "pyproject.toml"
          enable-cache: true

      - name: '🚧 Build source distribution'
        run: uv build --sdist -o wheelhouse

      - name: '📤 Upload artifact: sdist'
        uses: actions/upload-artifact@v7
        with:
          name: freeze-core-sdist
          path: wheelhouse
          compression-level: 0  # no compression

  build_sdist_msilib:
    name: Build sdist python-msilib
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      UV_SYSTEM_PYTHON: true
    steps:

      - name: '🧰 Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          #ref: ${{ inputs.branch }}
          repository: marcelotduarte/python-msilib

      - name: '⚙️ Set up Python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: '⚙️ Set up uv'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: "pyproject.toml"
          enable-cache: true

      - name: '🚧 Build source distribution'
        run: uv build --sdist -o wheelhouse

      - name: '📤 Upload artifact: sdist'
        uses: actions/upload-artifact@v7
        with:
          name: python-msilib-sdist
          path: wheelhouse
          compression-level: 0  # no compression

  build_msys2:
    needs:
      - build_sdist
      - build_sdist_freeze_core
      - build_sdist_msilib
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, sys: ucrt64,  env: ucrt-x86_64, icon: '🟨' }
          - { os: windows-11-arm, sys: clangarm64, env: clang-aarch64, icon: '🟧' }
          - { os: windows-latest, sys: mingw64, env: x86_64, icon: '🟦' }
          - { os: windows-latest, sys: mingw32, env: i686, icon: ⬛' }
          - { os: windows-latest, sys: clang64, env: clang-x86_64, icon: '🟧' }
    name: Build [${{ matrix.sys }} ${{ matrix.env }}]
    defaults:
      run:
        shell: msys2 {0}
    env:
      MINGW_ARCH: ${{ matrix.sys }}
    runs-on: ${{ matrix.os }}
    steps:

      - name: '⚙️ git config'
        run: git config --global core.autocrlf input
        shell: bash

      - name: '🧰 Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: '${{ matrix.icon }} Setup MSYS2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.sys}}
          install: base-devel
          update: true

      - name: ' Download artifact: freeze-core-sdist'
        uses: actions/download-artifact@v8
        with:
          name: freeze-core-sdist

      - name: '🚧 Build package: freeze-core'
        env:
          MAKEPKG_LINT_PKGBUILD: 1
        run: |
          PKGVER=$(ls freeze_core-*.tar.gz | awk -F- '{print $2}' | awk -F.tar.gz '{print $1}')
          PKGREL=9
          sed -i "s/pkgver=.*/pkgver=$PKGVER/" PKGBUILD-core
          sed -i "s/pkgrel=.*/pkgrel=$PKGREL/" PKGBUILD-core
          if [ "${{ inputs.tests }}" == "true" ]; then
            makepkg-mingw -sCLf --noconfirm --noprogressbar -p PKGBUILD-core
          else
            makepkg-mingw -sCLf --noconfirm --noprogressbar -p PKGBUILD-core --nocheck
          fi
          pacman -U "${MINGW_PACKAGE_PREFIX}-python-freeze-core-${PKGVER}-${PKGREL}-any.pkg.tar.zst" --noconfirm

      - name: ' Download artifact: python-msilib-sdist'
        uses: actions/download-artifact@v8
        with:
          name: python-msilib-sdist

      - name: '🚧 Build package: python-msilib'
        env:
          MAKEPKG_LINT_PKGBUILD: 1
        run: |
          PKGVER=$(ls python_msilib-*.tar.gz | awk -F- '{print $2}' | awk -F.tar.gz '{print $1}')
          PKGREL=9
          sed -i "s/pkgver=.*/pkgver=$PKGVER/" PKGBUILD-msilib
          sed -i "s/pkgrel=.*/pkgrel=$PKGREL/" PKGBUILD-msilib
          if [ "${{ inputs.tests }}" == "true" ]; then
            makepkg-mingw -sCLf --noconfirm --noprogressbar -p PKGBUILD-msilib
          else
            makepkg-mingw -sCLf --noconfirm --noprogressbar -p PKGBUILD-msilib --nocheck
          fi
          pacman -U "${MINGW_PACKAGE_PREFIX}-python-msilib-${PKGVER}-${PKGREL}-any.pkg.tar.zst" --noconfirm

      - name: ' Download artifact: cx-freeze-sdist'
        uses: actions/download-artifact@v8
        with:
          name: cx-freeze-sdist

      - name: '🚧 Build package: cx-freeze'
        env:
          MAKEPKG_LINT_PKGBUILD: 1
        run: |
          PKGVER=$(ls cx_freeze-*.tar.gz | awk -F- '{print $2}' | awk -F.tar.gz '{print $1}')
          sed -i "s/pkgver=.*/pkgver=$PKGVER/" PKGBUILD
          if [ "${{ inputs.tests }}" == "true" ]; then
            makepkg-mingw -sCLf --noconfirm --noprogressbar
            mv src/cx-freeze-test/.coverage .coverage.${{ matrix.sys }}
          else
            makepkg-mingw -sCLf --noconfirm --noprogressbar --nocheck
          fi

      - name: '📤 Upload artifact: package'
        uses: actions/upload-artifact@v7
        with:
          name: cx-freeze-msys2-${{ matrix.sys }}
          path: |
            mingw-w64-*.zst
            mingw-w64-*.zst.sig

      - name: '📤 Upload artifact: coverage'
        if: inputs.tests == true
        uses: actions/upload-artifact@v7
        with:
          name: cx-freeze-msys2-${{ matrix.sys }}-coverage
          path: .coverage.*
          include-hidden-files: true
